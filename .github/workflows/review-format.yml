name: Prepare reviewed formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'codex/public-repo-review-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npx prettier --write CHANGELOG.md CONTRIBUTING.md README.md tsconfig.json
      - name: Export formatted files for review
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          for (const path of ['CHANGELOG.md', 'CONTRIBUTING.md', 'README.md', 'tsconfig.json']) {
            console.log('REVIEW_FILE ' + JSON.stringify({ path, content: readFileSync(path, 'utf8') }))
          }
          JS
